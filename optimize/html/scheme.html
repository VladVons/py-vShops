<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <title>Scheme maker</title>

  <script src="scheme_files/lib.js"></script>
  <link rel="stylesheet" href="scheme_files/scheme.css">
  <link href="scheme_files/bootstrap.min.css" rel="stylesheet">
  <style>
    .nav-tabs .nav-link.active {
        background-color: gray;
        color: white;
    }
  </style>
</head>
<body class="bg-dark">
  <div class="mt-1">
    <!-- Nav Tabs -->
    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <a class="nav-link" data-bs-toggle="tab" href="#tab-product" aria-selected="false" role="tab" tabindex="-1">Product</a>
      </li>
      <li class="nav-item" role="presentation">
        <a class="nav-link active" data-bs-toggle="tab" href="#tab-category" aria-selected="true" role="tab">Category</a>
      </li>
      <li class="nav-item" role="presentation">
        <a class="nav-link" data-bs-toggle="tab" href="#tab-service" aria-selected="false" role="tab" tabindex="-1">Service</a>
      </li>
    </ul>

    <!-- Tab Panes -->
    <div class="tab-content">
      <!-- product -->
      <div class="tab-pane" id="tab-product" role="tabpanel">
<div class="row mt-2">
  <div class="col-3">
    <div class="d-flex gap-2">
      <button class="btn btn-primary flex-fill idBtnTest">
        <input type="checkbox" class="form-check-input me-3 idBtnTestEmul" onclick="event.stopPropagation()">
        test
      </button>
      <button class="btn btn-primary idBtnTplNew">tpl new</button>
      <button class="btn btn-primary idBtnTplRnd">tpl random</button>
      <button class="btn btn-primary idBtnPrettySrc">source</button>
    </div>
  </div>
  <div class="col-9">
    <input type="text" class="form-control idUrl" placeholder="url">
  </div>
</div>
<div class="row mt-2">
  <div class="col-5 editor">
    <div class="numbers"><span></span><span></span></div>
    <textarea class="form-control idTaScript" wrap="off" placeholder="script"></textarea>
  </div>
  <div class="col-7 editor">
    <div class="numbers"><span></span><span></span></div>
    <textarea class="form-control idTaResult" wrap="off" placeholder="result"></textarea>
  </div>
</div>
<div class="row mt-2">
  <textarea class="form-control idTaError" rows="10" placeholder="errors" readonly="readonly"></textarea>
</div>      </div>

      <!-- category -->
      <div class="tab-pane active show" id="tab-category" role="tabpanel">
<div class="row mt-2">
  <div class="col-3">
    <div class="d-flex gap-2">
      <button class="btn btn-primary flex-fill idBtnTest">
        <input type="checkbox" class="form-check-input me-3 idBtnTestEmul" onclick="event.stopPropagation()">
        test
      </button>
      <button class="btn btn-primary idBtnTplNew">tpl new</button>
      <button class="btn btn-primary idBtnTplRnd">tpl random</button>
      <button class="btn btn-primary idBtnPrettySrc">source</button>
    </div>
  </div>
  <div class="col-9">
    <input type="text" class="form-control idUrl" placeholder="url">
  </div>
</div>
<div class="row mt-2">
  <div class="col-5 editor">
    <div class="numbers"><span></span><span></span></div>
    <textarea class="form-control idTaScript" wrap="off" placeholder="script"></textarea>
  </div>
  <div class="col-7 editor">
    <div class="numbers"><span></span><span></span></div>
    <textarea class="form-control idTaResult" wrap="off" placeholder="result"></textarea>
  </div>
</div>
<div class="row mt-2">
  <textarea class="form-control idTaError" rows="10" placeholder="errors" readonly="readonly"></textarea>
</div>      </div>

      <!-- service -->
      <div class="tab-pane" id="tab-service" role="tabpanel">
        <div class="row mt-2">
          <div class="d-flex">
            <button class="btn btn-primary" id="BtnHelp">help</button>
          </div>
        </div>
        <div class="row mt-2">
          <div class="col container-height-90">
            <textarea class="form-control height-100" id="TaService" readonly="readonly"></textarea>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="scheme_files/bootstrap.bundle.min.js"></script>
  <script src="scheme_files/scheme.js"></script>
  <script type="text/javascript">
    const ScriptProduct = new TScriptTest('product')
    const ScriptCategory = new TScriptTest('category')

    const ElService = document.getElementById('TaService');
    document.getElementById('BtnHelp').onclick = (event) => {
      ElService.value = GetHelp()
    }
  </script>

</body></html>
